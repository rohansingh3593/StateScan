version: '3.9'

services:
  web:
    build: .
    ports:
      - "9000:8000"
    environment:
      DB_HOST: ${DB_HOST:?Set DB_HOST in .env}
      DB_PORT: ${DB_PORT:?Set DB_PORT in .env}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TEST_DB_HOST: ${TEST_DB_HOST:?Set TEST_DB_HOST in .env}
      TEST_DB_PORT: ${TEST_DB_PORT:?Set TEST_DB_PORT in .env}
      TEST_DB_NAME: ${TEST_DB_NAME:?Set TEST_DB_NAME in .env}
      TEST_DB_USER: ${TEST_DB_USER:?Set TEST_DB_USER in .env}
      TEST_DB_PASSWORD: ${TEST_DB_PASSWORD:?Set TEST_DB_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - statescan_network

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      TEST_DB_NAME: ${TEST_DB_NAME:?Set TEST_DB_NAME in .env}
      TEST_DB_USER: ${TEST_DB_USER:?Set TEST_DB_USER in .env}
      TEST_DB_PASSWORD: ${TEST_DB_PASSWORD:?Set TEST_DB_PASSWORD in .env}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-test-database.sh:/docker-entrypoint-initdb.d/10-init-test-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD psql -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - statescan_network

networks:
  statescan_network:
    driver: bridge

volumes:
  postgres_data:
